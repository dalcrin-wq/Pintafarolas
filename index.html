<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Que el «modo oscuro automático» de teles y móviles no le dé la vuelta a los colores (ni al QR). -->
  <meta name="color-scheme" content="only light">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garabatrola</title>
  <meta name="description" content="Si no sabes dibujar, aprende a mentir.">
  <link rel="preload" href="fonts/knewave.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/vendor/qrcode.js"></script>
</head>
<body class="host">
  <main id="app"></main>
  <div class="corner-row">
    <button class="corner" id="fullscreen">Pantalla completa</button>
    <button class="corner" id="mute" aria-pressed="false" title="Silenciar todo (tecla M)">🔊 Sonido</button>
  </div>
  <button class="corner right" id="sound-hint">🔇 Toca aquí para activar el sonido</button>
  <script type="module" src="js/host.js"></script>
</body>
</html>
